# Combine with the base Compose file (and branding override, if desired).
# This is a coherent policy: disabling the UI alone does not disable local APIs.
services:
  librechat:
    environment:
      ALLOW_REGISTRATION: "false"
      ALLOW_EMAIL_LOGIN: "false"
      ALLOW_PASSWORD_RESET: "false"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"
      OPENID_SCOPE: ${OPENID_SCOPE:-openid profile email}
      OPENID_REUSE_TOKENS: ${OPENID_REUSE_TOKENS:-false}
      USE_ENTRA_ID_FOR_PEOPLE_SEARCH: ${USE_ENTRA_ID_FOR_PEOPLE_SEARCH:-false}
      OPENID_GRAPH_SCOPES: ${OPENID_GRAPH_SCOPES-}
      OPENID_ON_BEHALF_FLOW_FOR_USERINFO_REQUIRED: ${OPENID_ON_BEHALF_FLOW_FOR_USERINFO_REQUIRED:-false}
  librechat-proxy:
    environment:
      GOVCHAT_BLOCK_PASSWORD_AUTH: "true"
  librechat-seed-admin:
    environment:
      DEV_SEED_ADMIN_ENABLED: "false"
  admin-panel:
    environment:
      ADMIN_SSO_ONLY: "true"
      API_SERVER_URL: http://librechat-proxy:3080
