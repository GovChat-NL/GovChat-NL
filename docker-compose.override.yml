services:
  librechat:
    entrypoint:
      - /bin/sh
      - /app/govchat-overlay/apply-branding.sh
    environment:
      BRANDING_MODE: ${BRANDING_MODE:-govchat}
      LIBRECHAT_NL_TRANSLATIONS_ENABLED: ${LIBRECHAT_NL_TRANSLATIONS_ENABLED:-true}
    volumes:
      - ./branding:/opt/branding/govchat:ro
      - ./custom-branding:/opt/branding/custom:ro
      - ./scripts/apply-branding.sh:/app/govchat-overlay/apply-branding.sh:ro
      - ./scripts/apply-dutch-translations.js:/app/govchat-overlay/apply-dutch-translations.js:ro
      - ./overlay/locales/nl/translation.json:/app/govchat-overlay/translation.json:ro
