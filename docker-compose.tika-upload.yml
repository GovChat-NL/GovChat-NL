# Opt-in overlay: docker compose -f docker-compose.yml -f docker-compose.tika-upload.yml
# Render LIBRECHAT_CONFIG_PATH first; no embedding/RAG routes are provided.
services:
  librechat:
    environment:
      RAG_API_URL: http://govchat-upload-extractor:8000
      GOVCHAT_TIKA_UPLOAD_ENABLED: "true"
    depends_on:
      document-extractor:
        condition: service_healthy
  upload-tika:
    build: ./services/tika
    image: govchat-tika-nl:3.2.3
    container_name: govchat-upload-tika
    environment:
      # Applies to BOTH watchdog and fork JVMs. Leave room for native OCR and tmpfs.
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx512m -XX:ActiveProcessorCount=1
      OMP_THREAD_LIMIT: "1"
    networks: [parser]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=100663296"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
  document-extractor:
    build: ./services/document-extractor
    image: govchat-tika-upload-adapter:local
    container_name: govchat-upload-extractor
    environment:
      # Must match LibreChat's signing key; a separate key would reject every upload.
      JWT_SECRET: ${JWT_SECRET:?LibreChat JWT secret required}
    networks:
      parser: {}
      librechat-net:
        aliases: [govchat-upload-extractor]
    read_only: true
    tmpfs: ["/scratch:rw,noexec,nosuid,size=67108864,uid=10001,gid=10001,mode=700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    depends_on: [upload-tika]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  parser:
    internal: true
