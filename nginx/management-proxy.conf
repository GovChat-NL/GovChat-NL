# Optional loopback adapters; authentication belongs to the outer ingress.
# Resolve on demand so absent optional services do not prevent startup.
resolver 127.0.0.11 valid=10s ipv6=off;
# Avoid recording management URLs and OAuth query parameters.
access_log off;

map $http_upgrade $management_connection {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  location = /healthz { return 200 'ok\n'; }
  location / { return 404; }
}

server {
  listen 5678;
  server_name _;
  client_max_body_size 16m;
  location / {
    set $n8n_upstream http://n8n:5678;
    proxy_pass $n8n_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto ${MANAGEMENT_FORWARDED_PROTO};
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $management_connection;
    proxy_cookie_path / ${N8N_MANAGEMENT_PATH};
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}

server {
  listen 6333;
  server_name _;
  client_max_body_size 32m;
  # Qdrant computes its API base by removing the final dashboard component.
  location = /dashboard/ { return 302 ${QDRANT_MANAGEMENT_PATH}dashboard; }
  location / {
    set $qdrant_upstream http://qdrant:6333;
    proxy_pass $qdrant_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Encoding '';
    proxy_redirect ~^/dashboard/?$ ${QDRANT_MANAGEMENT_PATH}dashboard;
    # Only rewrite quoted static paths, not JavaScript regexes or API payloads.
    sub_filter_types application/javascript text/css;
    sub_filter_once off;
    sub_filter '"/dashboard' '"${QDRANT_MANAGEMENT_PATH}dashboard';
    sub_filter "'/dashboard" "'${QDRANT_MANAGEMENT_PATH}dashboard";
    sub_filter 'url(/dashboard' 'url(${QDRANT_MANAGEMENT_PATH}dashboard';
  }
}

server {
  listen 7700;
  server_name _;
  location / {
    set $meili_upstream http://meilisearch:7700;
    proxy_pass $meili_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto ${MANAGEMENT_FORWARDED_PROTO};
  }
}

server {
  listen 3333;
  server_name _;
  location / {
    set $bridge_upstream http://n8n-openai-bridge:3333;
    proxy_pass $bridge_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
