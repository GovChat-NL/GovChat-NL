map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Honor forwarding metadata only when the direct peer is explicitly trusted.
# Keep the included trust list empty until the ingress proxy's real CIDRs are known.
include /etc/nginx/trusted-proxies.conf;
geo $realip_remote_addr $trusted_ingress_proxy {
  default 0;
  include /etc/nginx/trusted-proxies.geo;
}
map "$trusted_ingress_proxy:$http_x_forwarded_proto" $forwarded_proto {
  default       $scheme;
  "1:http"      http;
  "1:https"     https;
}

# Limits use the effective peer address. Forwarded addresses are only effective
# after a trusted proxy CIDR is configured above; raw client X-Forwarded-For is ignored.
limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
limit_req_zone  $binary_remote_addr zone=general_api_per_ip:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=overlay_api_per_ip:10m rate=15r/s;
limit_req_zone  $binary_remote_addr zone=image_jobs_per_ip:10m rate=2r/m;
limit_req_zone  $binary_remote_addr zone=normalize_image_per_ip:10m rate=12r/m;
limit_req_zone  $binary_remote_addr zone=webhook_per_ip:10m rate=5r/s;

real_ip_header X-Forwarded-For;
real_ip_recursive on;
server_tokens off;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 60s;
limit_req_status 429;
limit_conn_status 429;

upstream librechat_upstream {
  zone librechat_upstream 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server librechat:3080 resolve;
  keepalive 32;
}

server {
  listen 3080 default_server;
  server_name _;
  return 444;
}

server {
  listen 3080;
  server_name ${GOVCHAT_SERVER_NAMES};
  client_max_body_size 25m;
  # Generated at startup. Empty unless password-route blocking is enabled.
  include /var/run/govchat/password-auth.conf;
  limit_conn per_ip_connections 30;
  keepalive_timeout 30s;
  # Resolve the WIP Admin Overlay only when its API is requested, so the
  # reverse proxy starts normally while the admin-overlay profile is disabled.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $govchat_admin_upstream govchat-overlay-admin:3002;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;

  # Only the public Versimpelaar webhook is exposed; all other n8n paths are denied.
  location = /n8n/webhook/versimpelaar {
    limit_except POST { deny all; }
    limit_req zone=webhook_per_ip burst=10 nodelay;
    client_max_body_size 1m;
    proxy_pass http://n8n:5678/webhook/versimpelaar;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
  }

  location ^~ /n8n/ {
    return 404;
  }

  # Minimal UI styles are versioned with the deployment, not the app launcher.
  location = /govchat-overlay/minimal.css {
    alias /opt/govchat/minimal.css;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Public overlay assets contain no per-user data. Use short caching to keep
  # published UI changes responsive while preventing MIME sniffing.
  location ^~ /govchat-overlay/ {
    alias /opt/librechat/overlay/publish/;
    try_files $uri =404;
    expires 5m;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  # Per-user image paths are authorized against the signed LibreChat refresh
  # cookie by the private overlay-admin service. Referrer checks are not auth.
  location ~ "^/images/(?<image_owner>[A-Za-z0-9_-]{8,64})/(?<image_file>[^/]{1,255})$" {
    limit_except GET HEAD { deny all; }
    limit_req zone=general_api_per_ip burst=60 nodelay;
    auth_request /_internal/image-auth?owner=$image_owner;
    proxy_pass http://librechat_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires off;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  # Reject legacy/global image paths rather than expose another user's files.
  location /images/ {
    return 404;
  }

  # Internal auth_request endpoint; not directly addressable by clients.
  location = /_internal/image-auth {
    internal;
    proxy_pass http://$govchat_admin_upstream/api/internal/image-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Image-Owner $arg_owner;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /govchat-api/internal/image-auth {
    return 404;
  }

  # Image-generation jobs use the user's verified refresh cookie, never a
  # browser-visible shared bearer token. Strict size/rate limits cap cost abuse.
  location = /govchat-api/image-jobs {
    limit_except GET POST { deny all; }
    client_max_body_size 8k;
    limit_req zone=image_jobs_per_ip burst=2 nodelay;
    proxy_pass http://$govchat_admin_upstream/api/image-jobs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Origin $http_origin;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  location ^~ /govchat-api/image-jobs/ {
    limit_except GET { deny all; }
    limit_req zone=general_api_per_ip burst=30 nodelay;
    proxy_pass http://$govchat_admin_upstream/api/image-jobs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Origin $http_origin;
    proxy_set_header Accept-Encoding "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  # Expensive image normalization endpoint has a separate body and rate budget.
  location = /govchat-api/config/orchestrator/normalize-image {
    client_max_body_size 1100k;
    limit_req zone=normalize_image_per_ip burst=4 nodelay;
    proxy_pass http://$govchat_admin_upstream/api/config/orchestrator/normalize-image;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  location = /govchat-api/realtime-stt {
    limit_req zone=overlay_api_per_ip burst=10 nodelay;
    proxy_pass http://$govchat_admin_upstream/api/realtime-stt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  # Overlay APIs are same-origin and receive cookies only where their handler
  # needs them. Rate limiting is IP-based and does not trust request headers.
  location ^~ /govchat-api/ {
    limit_req zone=overlay_api_per_ip burst=30 nodelay;
    proxy_pass http://$govchat_admin_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  # The Dutch locale bundle is modified at container startup while retaining
  # LibreChat's upstream hashed filename. Do not let the browser's HTTP cache
  # keep the pre-override bytes; Workbox owns the separately versioned SW cache.
  location ~ ^/assets/locale-[^/]+\.js$ {
    proxy_pass http://librechat_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  # Let the browser's service-worker update check see the startup-patched bytes.
  location = /sw.js {
    proxy_pass http://librechat_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires off;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  }

  # LibreChat application, including API, WebSocket, and SSE paths.
  location / {
    limit_req zone=general_api_per_ip burst=60 nodelay;
    proxy_pass http://librechat_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    sub_filter_once off;
    sub_filter_types text/html;
    # Startup selects either the normal overlay or opt-in minimal styles.
    sub_filter '</head>' '${GOVCHAT_UI_HEAD}</head>';
  }
}
