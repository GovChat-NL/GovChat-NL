services:

  # ---------------------------------------------------------------------------
  #  LibreChat - Hoofdapplicatie
  #  Image: stable release (niet -dev)
  #  Registry: registry.librechat.ai (officieel, ghcr.io is verouderd)
  #
  #  Vereist op host (via SSH, eenmalig):
  #    mkdir -p /opt/librechat/{data/meilisearch,data/pgvector,data/redis,uploads,logs,images,overlay/data,overlay/publish}
  #    Standaard configuratiebestand staat in deze repo: ./librechat.yaml
  # ---------------------------------------------------------------------------
  librechat:
    image: registry.librechat.ai/danny-avila/librechat:v0.8.7
    container_name: librechat
    restart: unless-stopped
    expose:
      - "3080"
    depends_on:
      librechat-permissions:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
      litellm:
        condition: service_healthy
      n8n-openai-bridge:
        condition: service_started
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${LIBRECHAT_CONFIG_PATH:-./librechat.yaml}:/app/librechat.yaml:ro
      - /opt/librechat/uploads:/app/uploads
      - /opt/librechat/logs:/app/api/logs
      - /opt/librechat/images:/app/client/public/images
      - ./scripts/librechat-tool-event-overlay.js:/app/govchat-overlay/librechat-tool-event-overlay.js:ro
      - ./scripts/librechat-tool-event-protocol.js:/app/govchat-overlay/librechat-tool-event-protocol.js:ro
      - ./scripts/librechat-tool-event-preload.js:/app/govchat-overlay/librechat-tool-event-preload.js:ro
    environment:
      # --- Applicatie ---
      APP_TITLE: ${APP_TITLE:-GovChat-NL}
      HOST: 0.0.0.0
      PORT: "3080"
      NODE_ENV: production
      NODE_OPTIONS: --require=/app/govchat-overlay/librechat-tool-event-preload.js
      TEMP_CHAT_RETENTION_HOURS: ${GOVCHAT_CHAT_RETENTION_HOURS:-720}
      # Include Agents endpoint by default so the Agents UI is visible in LibreChat.
      ENDPOINTS: ${ENDPOINTS:-custom,agents}
      DOMAIN_CLIENT: ${PUBLIC_BASE_URL}
      DOMAIN_SERVER: ${PUBLIC_BASE_URL}
      TRUST_PROXY: "1"

      # --- MongoDB ---
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongodb:27017/LibreChat?authSource=admin

      # --- Redis (sessies + caching) ---
      USE_REDIS: "true"
      REDIS_URI: redis://redis:6379

      # --- JWT tokens ---
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      # --- Credential encryptie ---
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      SESSION_SECRET: ${SESSION_SECRET}

      # --- Registratie en login ---
      ALLOW_REGISTRATION: ${DEV_SEED_ADMIN_ENABLED}
      ALLOW_EMAIL_LOGIN: ${DEV_SEED_ADMIN_ENABLED}
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "false"

      # --- Entra ID SSO (OpenID Connect) ---
      OPENID_CLIENT_ID: ${OPENID_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET}
      OPENID_ISSUER: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0/
      OPENID_SESSION_SECRET: ${OPENID_SESSION_SECRET}
      OPENID_SCOPE: openid profile email offline_access
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_BUTTON_LABEL: Inloggen met Microsoft
      OPENID_USE_END_SESSION_ENDPOINT: "true"
      DEBUG_OPENID_REQUESTS: "${DEBUG_OPENID_REQUESTS:-false}"
      OPENID_GENERATE_NONCE: "true"


      # --- Token reuse (verplicht voor Entra ID groepssync) ---
      OPENID_REUSE_TOKENS: "true"

      # --- Toegangsbeperking via Entra ID app-rol ---
      OPENID_REQUIRED_ROLE_TOKEN_KIND: id
      OPENID_REQUIRED_ROLE_PARAMETER_PATH: roles
      OPENID_REQUIRED_ROLE: ${OPENID_REQUIRED_ROLE}

      # Caching Configuration
      OPENID_JWKS_URL_CACHE_ENABLED: "true"
      OPENID_JWKS_URL_CACHE_TIME: "600000"  # 10 minutes in milliseconds
 
      # Azure-specific Configuration
      OPENID_ON_BEHALF_FLOW_FOR_USERINFO_REQUIRED: "true"
      OPENID_ON_BEHALF_FLOW_USERINFO_SCOPE: "user.read"


      # --- Microsoft Graph API (groepssync + people search) ---
      USE_ENTRA_ID_FOR_PEOPLE_SEARCH: "true"
      ENTRA_ID_INCLUDE_OWNERS_AS_MEMBERS: "true"
      OPENID_GRAPH_SCOPES: "User.Read,GroupMember.Read.All,People.Read,User.ReadBasic.All offline_access"

      # --- MeiliSearch ---
      SEARCH: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

      # --- RAG API ---
      RAG_API_URL: ${RAG_API_URL:-}

      # --- LiteLLM (externe AI gateway) ---
      # Beide nodig: API_KEY voor directe auth, URL voor librechat.yaml ${LITELLM_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_URL: ${LITELLM_URL}
      N8N_OPENAI_BRIDGE_BEARER_TOKEN: ${N8N_OPENAI_BRIDGE_BEARER_TOKEN}

      # --- Admin Panel callback URL voor SSO ---
      ADMIN_PANEL_URL: ${ADMIN_PANEL_PUBLIC_URL}

      # --- Logging ---
      DEBUG_LOGGING: "${DEBUG_LOGGING:-false}"
      DEBUG_CONSOLE: "${DEBUG_CONSOLE:-false}"

      # --- Email (uitgeschakeld) ---
      EMAIL_SERVICE: ""

    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  LibreChat-aware retention worker (same pinned image, no HTTP listener)
  #  Uses LibreChat's model and file-service deletion paths, not raw DB deletes.
  # ---------------------------------------------------------------------------
  govchat-retention:
    image: registry.librechat.ai/danny-avila/librechat:v0.8.7
    container_name: govchat-retention
    restart: unless-stopped
    command: ["node", "/app/govchat-overlay/govchat-retention-worker.js"]
    depends_on:
      librechat-permissions:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    volumes:
      - ${LIBRECHAT_CONFIG_PATH:-./librechat.yaml}:/app/librechat.yaml:ro
      - /opt/librechat/uploads:/app/uploads
      - /opt/librechat/images:/app/client/public/images
      - ./scripts/govchat-retention-policy.js:/app/govchat-overlay/govchat-retention-policy.js:ro
      - ./scripts/govchat-retention-worker.js:/app/govchat-overlay/govchat-retention-worker.js:ro
    environment:
      NODE_ENV: production
      # The standalone worker uses process-local caches; CI disables LibreChat's
      # periodic cache-maintenance timer, which is normally stopped by the HTTP server.
      CI: "true"
      DOMAIN_CLIENT: ${PUBLIC_BASE_URL}
      DOMAIN_SERVER: ${PUBLIC_BASE_URL}
      TZ: ${TZ:-Europe/Amsterdam}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongodb:27017/LibreChat?authSource=admin
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      GOVCHAT_CHAT_RETENTION_HOURS: ${GOVCHAT_CHAT_RETENTION_HOURS:-720}
      GOVCHAT_UPLOAD_RETENTION_DAYS: ${GOVCHAT_UPLOAD_RETENTION_DAYS:-30}
      GOVCHAT_PROMPT_RETENTION_DAYS: ${GOVCHAT_PROMPT_RETENTION_DAYS:-730}
      GOVCHAT_GENERATED_IMAGE_RETENTION_DAYS: ${GOVCHAT_GENERATED_IMAGE_RETENTION_DAYS:-30}
      GOVCHAT_GENERATED_IMAGES_DIR: /app/client/public/images
      GOVCHAT_RETENTION_SWEEP_INTERVAL_MINUTES: ${GOVCHAT_RETENTION_SWEEP_INTERVAL_MINUTES:-60}
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  Init job: zet juiste rechten op upload mount voor non-root LibreChat user
  #  - Draait eenmalig per `docker compose up`
  #  - Maakt /opt/librechat/uploads schrijfbaar voor UID/GID 1000 (node)
  # ---------------------------------------------------------------------------
  librechat-permissions:
    image: alpine:3.20
    container_name: librechat-permissions
    restart: "no"
    command: >
      sh -lc "
        mkdir -p /app/uploads/temp /app/images /app/n8n-logs &&
        chown -R 1000:1000 /app/uploads /app/images /app/n8n-logs &&
        chmod -R u+rwX,g+rwX /app/uploads /app/images /app/n8n-logs
      "
    volumes:
      - /opt/librechat/logs/n8n:/app/n8n-logs
      - /opt/librechat/uploads:/app/uploads
      - /opt/librechat/images:/app/images
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  Dev-only seeder voor eerste LibreChat admin user
  #  - Alleen actief als DEV_SEED_ADMIN_ENABLED=true
  #  - Verwacht lege user-collectie (eerste registratie wordt admin)
  # ---------------------------------------------------------------------------
  librechat-seed-admin:
    image: curlimages/curl:8.9.1
    container_name: librechat-seed-admin
    restart: "no"
    depends_on:
      librechat:
        condition: service_started
    environment:
      LIBRECHAT_BASE_URL: http://librechat:3080
      DEV_SEED_ADMIN_ENABLED: ${DEV_SEED_ADMIN_ENABLED:-false}
      DEV_SEED_ADMIN_NAME: ${DEV_SEED_ADMIN_NAME:-Local Admin}
      DEV_SEED_ADMIN_EMAIL: ${DEV_SEED_ADMIN_EMAIL:-admin@local.test}
      DEV_SEED_ADMIN_PASSWORD: ${DEV_SEED_ADMIN_PASSWORD:-ChangeMe!123}
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -e

        if [ "$${DEV_SEED_ADMIN_ENABLED}" != "true" ]; then
          echo "DEV_SEED_ADMIN_ENABLED=false; seeder wordt overgeslagen"
          exit 0
        fi

        echo "Wachten op LibreChat..."
        i=0
        until [ $${i} -ge 60 ]; do
          if curl -fsS "$${LIBRECHAT_BASE_URL}/" >/dev/null 2>&1; then
            break
          fi
          i=$$((i+1))
          sleep 2
        done

        if [ $${i} -ge 60 ]; then
          echo "LibreChat niet bereikbaar binnen timeout"
          exit 1
        fi

        echo "Probeer admin gebruiker te registreren (dev-only)..."

        RESPONSE=$$(curl -sS -X POST "$${LIBRECHAT_BASE_URL}/api/auth/register" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$${DEV_SEED_ADMIN_NAME}\",\"email\":\"$${DEV_SEED_ADMIN_EMAIL}\",\"password\":\"$${DEV_SEED_ADMIN_PASSWORD}\",\"confirm_password\":\"$${DEV_SEED_ADMIN_PASSWORD}\"}" || true)

        echo "$${RESPONSE}" | grep -Eiq "already|exists|duplicate|succes|success" && {
          echo "Seeder gereed (account bestaat al of registratie gelukt)"
          exit 0
        }

        echo "$${RESPONSE}" | grep -Eiq "error|invalid|failed" && {
          echo "Eerste registratiepoging gaf fout; probeer alternatief payload-formaat"
        }

        RESPONSE2=$$(curl -sS -X POST "$${LIBRECHAT_BASE_URL}/api/auth/register" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$${DEV_SEED_ADMIN_NAME}\",\"email\":\"$${DEV_SEED_ADMIN_EMAIL}\",\"password\":\"$${DEV_SEED_ADMIN_PASSWORD}\",\"confirmPassword\":\"$${DEV_SEED_ADMIN_PASSWORD}\"}" || true)

        echo "$${RESPONSE2}" | grep -Eiq "already|exists|duplicate|succes|success" && {
          echo "Seeder gereed (account bestaat al of registratie gelukt)"
          exit 0
        }

        echo "Seeder kon user niet automatisch registreren. Response: $${RESPONSE2}"
        exit 1
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  LibreChat reverse proxy
  #  - Serveert de app publiek op :3080
  #  - Injecteert GovChat overlay assets (help + app launcher) in HTML
  # ---------------------------------------------------------------------------
  librechat-proxy:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    container_name: librechat-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      librechat:
        condition: service_started
    ports:
      - "${LC_PORT:-3080}:3080"
    volumes:
      - ./nginx/librechat-overlay.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/trusted-proxies.conf:/etc/nginx/trusted-proxies.conf:ro
      - ./nginx/trusted-proxies.geo:/etc/nginx/trusted-proxies.geo:ro
      - /opt/librechat/overlay/publish:/opt/librechat/overlay/publish:ro
      - ./overlay/src:/opt/librechat/overlay/src:ro
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  MongoDB 8.0.20 - Gesprekken, gebruikers, agents, presets
  #  Gepinde versie conform officieel LibreChat docker-compose
  #  Hostpoort standaard alleen op localhost; gebruik VPN/firewall of SSH-tunnel
  #  als remote MongoDB-toegang expliciet noodzakelijk is.
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0.20
    container_name: librechat-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_BIND_IP:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: LibreChat
    command: mongod --quiet
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  Redis 7 - Sessie-opslag en caching
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: librechat-redis
    restart: unless-stopped
    volumes:
      - /opt/librechat/data/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  MeiliSearch v1.35.1 - Full-text zoeken in conversatiegeschiedenis
  #  Versie conform officieel LibreChat docker-compose
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: librechat-meilisearch
    restart: unless-stopped
    volumes:
      - /opt/librechat/data/meilisearch:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  LiteLLM PostgreSQL - opslag voor LiteLLM modellen/sleutels/logs
  # ---------------------------------------------------------------------------
  litellm-postgres:
    image: postgres:16-alpine
    container_name: librechat-litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD}
    volumes:
      - /opt/librechat/data/litellm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  Beleidskompas PostgreSQL - de stand van elke casus: casustekst,
  #  uitwerkingen per deelstap (met versies) en het gesprek.
  #  Alleen govchat-overlay-admin praat ermee; n8n en de pagina gaan via
  #  de HTTP-API van die service.
  #  De data staat in een Docker-volume, net als die van MongoDB en n8n.
  # ---------------------------------------------------------------------------
  beleidskompas-postgres:
    image: postgres:16-alpine
    container_name: librechat-beleidskompas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beleidskompas
      POSTGRES_USER: beleidskompas
      POSTGRES_PASSWORD: ${BELEIDSKOMPAS_POSTGRES_PASSWORD}
    volumes:
      - beleidskompas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beleidskompas -d beleidskompas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  LiteLLM - modelrouter/proxy
  #  Secrets/keys komen direct uit .env
  # ---------------------------------------------------------------------------
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:main-stable
    container_name: librechat-litellm
    restart: unless-stopped
    depends_on:
      litellm-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_POSTGRES_PASSWORD}@litellm-postgres:5432/litellm
      DATABASE_CONNECTION_POOL_LIMIT: ${LITELLM_DB_POOL_LIMIT:-10}
      DATABASE_CONNECTION_TIMEOUT: ${LITELLM_DB_TIMEOUT:-30}
      STORE_MODEL_IN_DB: "True"
      AZURE_OPENAI_API_BASE: ${AZURE_OPENAI_API_BASE}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_CHAT_MODEL: ${AZURE_OPENAI_CHAT_MODEL}
      AZURE_OPENAI_STT_API_BASE: ${AZURE_OPENAI_STT_API_BASE}
      AZURE_OPENAI_STT_API_VERSION: ${AZURE_OPENAI_STT_API_VERSION}
      AZURE_OPENAI_STT_API_KEY: ${AZURE_OPENAI_STT_API_KEY}
      AZURE_OPENAI_REALTIME_API_BASE: ${AZURE_OPENAI_REALTIME_API_BASE}
      AZURE_OPENAI_REALTIME_API_VERSION: ${AZURE_OPENAI_REALTIME_API_VERSION}
      AZURE_OPENAI_REALTIME_API_KEY: ${AZURE_OPENAI_REALTIME_API_KEY}
      LITELLM_STT_NEXT_MODEL: ${LITELLM_STT_NEXT_MODEL}
      LITELLM_STT_NEXT_API_BASE: ${LITELLM_STT_NEXT_API_BASE}
      LITELLM_STT_NEXT_API_VERSION: ${LITELLM_STT_NEXT_API_VERSION}
      LITELLM_STT_NEXT_API_KEY: ${LITELLM_STT_NEXT_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      LITELLM_LOG: ${LITELLM_LOG_LEVEL:-WARNING}
    volumes:
      - ${LITELLM_CONFIG_PATH:-./litellm/config.yaml}:/app/config.yaml:ro
    command:
      - "--port"
      - "4000"
      - "--num_workers"
      - "${LITELLM_NUM_WORKERS:-1}"
      - "--config"
      - "/app/config.yaml"
      - "--drop_params"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  n8n PostgreSQL - workflow metadata + execution storage
  # ---------------------------------------------------------------------------
  n8n-postgres:
    image: postgres:16-alpine
    container_name: librechat-n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  n8n - workflow engine (alleen intern op het Docker-netwerk)
  #  - Versimpelaar webhook draait hierop
  #  - Alleen webhook route wordt via nginx geproxied
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.25.7}
    container_name: librechat-n8n
    restart: unless-stopped
    depends_on:
      librechat-permissions:
        condition: service_completed_successfully
      n8n-postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    expose:
      - "5678"
      - "5679"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}

      # Security hardening
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      # Runtime
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_HOST: localhost
      N8N_PATH: /
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678
      GENERIC_TIMEZONE: ${TZ:-Europe/Amsterdam}
      TZ: ${TZ:-Europe/Amsterdam}
      N8N_LOG_LEVEL: error
      N8N_LOG_OUTPUT: file
      N8N_LOG_FILE_LOCATION: /var/log/n8n/n8n.log
      N8N_LOG_FILE_SIZE_MAX: ${N8N_LOG_FILE_SIZE_MAX:-10485760}
      N8N_LOG_FILE_COUNT_MAX: ${N8N_LOG_FILE_COUNT_MAX:-1000}
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTION_RETENTION_HOURS:-718}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${N8N_EXECUTION_PRUNE_MAX_COUNT:-10000}
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: ${N8N_EXECUTION_HARD_DELETE_BUFFER_HOURS:-0}
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: ${N8N_EXECUTION_HARD_DELETE_INTERVAL_MINUTES:-15}
      EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL: ${N8N_EXECUTION_SOFT_DELETE_INTERVAL_MINUTES:-60}
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      # Nodig voor Code node gebruik van $env.* in external runners mode
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path,crypto,http,https,url
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: ${N8N_RUNNERS_TASK_REQUEST_TIMEOUT:-300}
      N8N_RUNNERS_GRANT_TOKEN_TTL: ${N8N_RUNNERS_GRANT_TOKEN_TTL:-120}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}

      # LLM target + webhook shared secret
      LITELLM_URL: ${LITELLM_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      AZURE_OPENAI_STT_API_BASE: ${AZURE_OPENAI_STT_API_BASE}
      AZURE_OPENAI_STT_API_VERSION: ${AZURE_OPENAI_STT_API_VERSION}
      AZURE_OPENAI_STT_API_KEY: ${AZURE_OPENAI_STT_API_KEY}
      N8N_ENABLE_IMAGE_TOOL: ${N8N_ENABLE_IMAGE_TOOL:-false}
      N8N_LITELLM_IMAGE_BASE_URL: ${N8N_LITELLM_IMAGE_BASE_URL:-${LITELLM_URL}}
      N8N_LITELLM_IMAGE_API_KEY: ${N8N_LITELLM_IMAGE_API_KEY:-${LITELLM_API_KEY}}
      N8N_LITELLM_IMAGE_MODEL: ${N8N_LITELLM_IMAGE_MODEL:-gpt-image-1}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CRAWLER_ADMIN_BASE_URL: ${CRAWLER_ADMIN_BASE_URL:-http://govchat-overlay-admin:3002}
      CRAWLER_INTERNAL_TOKEN: ${CRAWLER_INTERNAL_TOKEN:-${N8N_WEBHOOK_TOKEN}}
    volumes:
      - n8n-data:/home/node/.n8n
      - /opt/librechat/logs/n8n:/var/log/n8n
      - /opt/librechat/images:/shared-images
      - ./scripts/n8n-createAgentSequence.patched.js:/usr/local/lib/node_modules/n8n/node_modules/.pnpm/@n8n+n8n-nodes-langchain@file+packages+@n8n+nodes-langchain_8bf81e0cdf1fe65cc684d3daaa3ca5c1/node_modules/@n8n/n8n-nodes-langchain/dist/nodes/agents/Agent/agents/ToolsAgent/V3/helpers/createAgentSequence.js:ro
      - ./scripts/n8n-processEventStream.patched.js:/usr/local/lib/node_modules/n8n/node_modules/.pnpm/@n8n+n8n-nodes-langchain@file+packages+@n8n+nodes-langchain_8bf81e0cdf1fe65cc684d3daaa3ca5c1/node_modules/@n8n/n8n-nodes-langchain/dist/utils/agent-execution/processEventStream.js:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - librechat-net
    logging:
      driver: local
      options:
        max-size: ${N8N_LOG_MAX_SIZE:-10m}
        max-file: ${N8N_LOG_MAX_FILES:-10}

  n8n-log-pruner:
    build:
      context: ./services/n8n-log-retention
      dockerfile: Dockerfile
    image: govchat-n8n-log-pruner:local
    container_name: govchat-n8n-log-pruner
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    environment:
      N8N_LOG_RETENTION_DAYS: ${N8N_LOG_RETENTION_DAYS:-30}
      N8N_LOG_PRUNE_INTERVAL_SECONDS: ${N8N_LOG_PRUNE_INTERVAL_SECONDS:-3600}
    volumes:
      - /opt/librechat/logs/n8n:/var/log/n8n
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  n8n external task runners (vereist voor production-safe code execution)
  # ---------------------------------------------------------------------------
  n8n-runners:
    image: n8nio/runners:${N8N_VERSION:-2.25.7}
    container_name: librechat-n8n-runners
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      # Nodig voor Code node gebruik van $env.* in runner context
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path,crypto,http,https,url
      LITELLM_URL: ${LITELLM_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      AZURE_OPENAI_STT_API_BASE: ${AZURE_OPENAI_STT_API_BASE}
      AZURE_OPENAI_STT_API_VERSION: ${AZURE_OPENAI_STT_API_VERSION}
      AZURE_OPENAI_STT_API_KEY: ${AZURE_OPENAI_STT_API_KEY}
      N8N_ENABLE_IMAGE_TOOL: ${N8N_ENABLE_IMAGE_TOOL:-false}
      N8N_LITELLM_IMAGE_BASE_URL: ${N8N_LITELLM_IMAGE_BASE_URL:-${LITELLM_URL}}
      N8N_LITELLM_IMAGE_API_KEY: ${N8N_LITELLM_IMAGE_API_KEY:-${LITELLM_API_KEY}}
      N8N_LITELLM_IMAGE_MODEL: ${N8N_LITELLM_IMAGE_MODEL:-gpt-image-1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "30"
      N8N_RUNNERS_TASK_TIMEOUT: "180"
      N8N_RUNNERS_LAUNCHER_LOG_LEVEL: warn
    volumes:
      - /opt/librechat/images:/shared-images
      - ./n8n/task-runners.json:/etc/n8n-task-runners.json:ro
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  n8n bootstrap - importeert workflows uit de lokale monorepo-component agents/
  # ---------------------------------------------------------------------------
  n8n-bootstrap:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.25.7}
    container_name: librechat-n8n-bootstrap
    restart: "no"
    depends_on:
      n8n:
        condition: service_healthy
      n8n-runners:
        condition: service_started
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:-}
      N8N_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME:-GovChat}
      N8N_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME:-Admin}
      N8N_OWNER_ENFORCE: ${N8N_OWNER_ENFORCE:-true}
      LITELLM_URL: ${LITELLM_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      AGENTS_BOOTSTRAP_FORCE: ${AGENTS_BOOTSTRAP_FORCE:-false}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./agents:/workspace/agents:ro
      - ./n8n/bootstrap.js:/bootstrap/bootstrap.js:ro
    entrypoint: ["node", "/bootstrap/bootstrap.js"]
    networks:
      - librechat-net

  n8n-openai-bridge:
    # Build the clean GovChat-NL main-branch checkout kept beside this repository.
    # It emits the sideband used by the LibreChat and n8n runtime overlays.
    image: govchat-nl/n8n-openai-bridge:main
    build:
      context: ../n8n-openai-bridge-main
      dockerfile: docker/Dockerfile.build
    container_name: n8n-openai-bridge
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    expose:
      - "3333"
    environment:
      PORT: "3333"
      BEARER_TOKEN: ${N8N_OPENAI_BRIDGE_BEARER_TOKEN}
      N8N_WEBHOOK_BEARER_TOKEN: ${N8N_WEBHOOK_TOKEN}
      MODEL_LOADER_TYPE: file
      MODELS_CONFIG_FILE: /app/models.json
      LOG_REQUESTS: ${N8N_OPENAI_BRIDGE_LOG_REQUESTS:-false}
      ENABLE_TASK_DETECTION: ${N8N_OPENAI_BRIDGE_ENABLE_TASK_DETECTION:-false}
      SESSION_ID_HEADERS: ${N8N_OPENAI_BRIDGE_SESSION_ID_HEADERS:-X-Session-Id,X-Chat-Id,X-OpenWebUI-Chat-Id}
      USER_ID_HEADERS: ${N8N_OPENAI_BRIDGE_USER_ID_HEADERS:-X-User-Id,X-OpenWebUI-User-Id}
      USER_EMAIL_HEADERS: ${N8N_OPENAI_BRIDGE_USER_EMAIL_HEADERS:-X-User-Email,X-OpenWebUI-User-Email}
      USER_NAME_HEADERS: ${N8N_OPENAI_BRIDGE_USER_NAME_HEADERS:-X-User-Name,X-OpenWebUI-User-Name}
      USER_ROLE_HEADERS: ${N8N_OPENAI_BRIDGE_USER_ROLE_HEADERS:-X-User-Role,X-OpenWebUI-User-Role}
    volumes:
      - ./bridge/models.json:/app/models.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  Qdrant - interne vector store voor OpenBesluitvorming-workflows
  #  Geen hostpoort: alleen services op het Compose-netwerk kunnen erbij.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: librechat-qdrant
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshot-cache:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  Opt-in local test data restore. Not part of normal Compose startup.
  #  Run with --profile openbesluitvorming-test after explicitly acknowledging.
  # ---------------------------------------------------------------------------
  openbesluitvorming-test-restore:
    image: python:3.12-slim
    container_name: librechat-openbesluitvorming-test-restore
    restart: "no"
    profiles:
      - openbesluitvorming-test
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      OPENBESLUITVORMING_TEST_RESTORE_APPROVED: ${OPENBESLUITVORMING_TEST_RESTORE_APPROVED:-}
      OPENBESLUITVORMING_TEST_RESTORE_REPLACE_EXISTING: ${OPENBESLUITVORMING_TEST_RESTORE_REPLACE_EXISTING:-}
    volumes:
      - qdrant-snapshot-cache:/qdrant/snapshots
      - ./testdata/openbesluitvorming:/testdata:ro
      - ./scripts/openbesluitvorming-test-restore.py:/restore.py:ro
    entrypoint: ["python", "/restore.py"]
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  pgvector 0.8.0 (pg16) - Vector extensie voor RAG embeddings
  #  pg16 omdat de data directory al geinitialiseerd is met pg16
  # ---------------------------------------------------------------------------
  pgvector:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: librechat-pgvector
    restart: unless-stopped
    volumes:
      - /opt/librechat/data/pgvector:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librechat -d librechat_rag"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - rag
      - admin
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  RAG API - Document indexering en retrieval via LangChain + FastAPI
  #  Embeddings via LiteLLM gateway
  #  Registry: registry.librechat.ai (officieel)
  # ---------------------------------------------------------------------------
  rag-api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: librechat-rag-api
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - /opt/librechat/uploads:/uploads
    environment:
      # PostgreSQL verbinding
      DB_HOST: pgvector
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Upload map (shared met librechat)
      RAG_UPLOAD_DIR: /uploads

      # Embeddings via LiteLLM
      EMBEDDINGS_PROVIDER: openai
      EMBEDDINGS_MODEL: text-embedding-3-small
      OPENAI_API_BASE: ${LITELLM_URL}/v1
      OPENAI_API_KEY: ${LITELLM_API_KEY}

      # Chunk instellingen
      CHUNK_SIZE: "1500"
      CHUNK_OVERLAP: "100"
      RAG_TOP_K: "4"
    profiles:
      - rag
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  LibreChat Admin Panel - Officieel beheerportaal (ClickHouse)
  #  https://github.com/ClickHouse/librechat-admin-panel
  #  VITE_API_BASE_URL moet de publieke URL zijn (browser moet het bereiken)
  # ---------------------------------------------------------------------------
  admin-panel:
    image: ghcr.io/clickhouse/librechat-admin-panel:latest
    container_name: librechat-admin-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PANEL_PORT:-3100}:3000"
    depends_on:
      - librechat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      VITE_API_BASE_URL: ${PUBLIC_BASE_URL}
      API_SERVER_URL: http://librechat:3080
      ADMIN_SSO_ONLY: "${ADMIN_SSO_ONLY:-false}"
      PORT: "3000"
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  GovChat Overlay Admin
  #  Publiceert help/apps-configuratie naar gedeelde overlay-map.
  #  WIP; opt-in met --profile admin-overlay. Standaard uitgeschakeld.
  #  Gebruikt LibreChat-specifieke defaults via bind mount.
  # ---------------------------------------------------------------------------
  govchat-overlay-admin:
    build:
      context: ./services/admin-overlay/admin
      dockerfile: Dockerfile
    image: govchat-overlay-admin:local
    container_name: govchat-overlay-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOVCHAT_OVERLAY_ADMIN_PORT:-3002}:3002"
    environment:
      - ADMIN_PASSWORD=${GOVCHAT_ADMIN_PASSWORD}
      - CORS_ORIGIN=${GOVCHAT_OVERLAY_CORS_ORIGIN}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - DATA_DIR=/data
      - PUBLISH_DIR=/publish
      - BELEIDSKOMPAS_N8N_BASE_URL=${BELEIDSKOMPAS_N8N_BASE_URL:-http://n8n:5678}
      - BELEIDSKOMPAS_N8N_WEBHOOK_TOKEN=${BELEIDSKOMPAS_N8N_WEBHOOK_TOKEN:-${N8N_WEBHOOK_TOKEN}}
      - BELEIDSKOMPAS_DB_HOST=beleidskompas-postgres
      - BELEIDSKOMPAS_DB_PASSWORD=${BELEIDSKOMPAS_POSTGRES_PASSWORD}
      - BELEIDSKOMPAS_STORE_TOKEN=${BELEIDSKOMPAS_STORE_TOKEN}
      - IMAGE_JOBS_ENABLED=${IMAGE_JOBS_ENABLED:-false}
      - IMAGE_JOBS_WEBHOOK_URL=${IMAGE_JOBS_WEBHOOK_URL:-http://n8n:5678/webhook/image-generator}
      - IMAGE_JOBS_WEBHOOK_TOKEN=${IMAGE_JOBS_WEBHOOK_TOKEN:-${N8N_WEBHOOK_TOKEN}}
      - IMAGE_JOBS_CONCURRENCY=${IMAGE_JOBS_CONCURRENCY:-1}
      - IMAGE_JOBS_TTL_HOURS=${IMAGE_JOBS_TTL_HOURS:-24}
      - CRAWLER_N8N_WEBHOOK_URL=${CRAWLER_N8N_WEBHOOK_URL:-http://n8n:5678/webhook/govcrawler-run}
      - CRAWLER_N8N_WEBHOOK_TOKEN=${CRAWLER_N8N_WEBHOOK_TOKEN:-${N8N_WEBHOOK_TOKEN}}
      - CRAWLER_INTERNAL_TOKEN=${CRAWLER_INTERNAL_TOKEN:-${N8N_WEBHOOK_TOKEN}}
      - CRAWLER_RUNS_LIMIT=${CRAWLER_RUNS_LIMIT:-200}
      - CRAWLER_EMBEDDING_MODEL=${CRAWLER_EMBEDDING_MODEL:-govchat-embedding}
      - REALTIME_STT_TOKEN=${REALTIME_STT_TOKEN:-${N8N_WEBHOOK_TOKEN}}
      - REALTIME_STT_PROVIDER=${REALTIME_STT_PROVIDER:-litellm}
      - LITELLM_REALTIME_URL=${LITELLM_REALTIME_URL:-${LITELLM_URL:-http://litellm:4000}/v1/realtime}
      - LITELLM_REALTIME_MODEL=${LITELLM_REALTIME_MODEL:-gpt-4o-realtime-preview}
      - LITELLM_REALTIME_API_KEY=${LITELLM_REALTIME_API_KEY:-${LITELLM_API_KEY}}
      - AZURE_OPENAI_REALTIME_API_BASE=${AZURE_OPENAI_REALTIME_API_BASE:-}
      - AZURE_OPENAI_REALTIME_API_VERSION=${AZURE_OPENAI_REALTIME_API_VERSION:-}
      - AZURE_OPENAI_REALTIME_API_KEY=${AZURE_OPENAI_REALTIME_API_KEY:-}
      - AZURE_OPENAI_REALTIME_MODEL=${AZURE_OPENAI_REALTIME_MODEL:-}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
    volumes:
      - /opt/librechat/overlay/data:/data
      - /opt/librechat/overlay/publish:/publish
      - ./overlay/defaults:/app/defaults:ro
    profiles:
      - admin-overlay
    depends_on:
      beleidskompas-postgres:
        condition: service_healthy
    networks:
      - librechat-net

  # ---------------------------------------------------------------------------
  #  PgAdmin - Beheerinterface voor pgvector database
  #  Optioneel: start met  docker compose --profile admin up -d
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: librechat-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5051}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - /opt/librechat/data/pgadmin:/var/lib/pgadmin
    depends_on:
      pgvector:
        condition: service_healthy
    profiles:
      - admin
    networks:
      - librechat-net

networks:
  librechat-net:
    name: librechat-net
    driver: bridge

volumes:
  mongodb-data:
  n8n-data:
  n8n-postgres-data:
  qdrant-storage:
  qdrant-snapshot-cache:
  beleidskompas-postgres-data:
