# Generated by scripts/make-branding.sh from the files in deploy/branding/. Do not edit.
# The logo and icons go over the ones in the LibreChat image; nothing is patched.

volumes:
  - name: branding
    configMap:
      name: librechat-librechat-branding   # <release>-librechat-branding

volumeMounts:
  - { name: branding, mountPath: /app/client/dist/assets/logo.svg, subPath: logo.svg, readOnly: true }
  - { name: branding, mountPath: /app/client/dist/assets/favicon-16x16.png, subPath: favicon-16x16.png, readOnly: true }
  - { name: branding, mountPath: /app/client/dist/assets/favicon-32x32.png, subPath: favicon-32x32.png, readOnly: true }
  - { name: branding, mountPath: /app/client/dist/assets/apple-touch-icon-180x180.png, subPath: apple-touch-icon-180x180.png, readOnly: true }

# Changes when a file changes, so that the pod restarts with the new files.
podAnnotations:
  govchat/branding: "2667173858"

additionalConfigMaps:
  branding:
    binaryData:
      logo.svg: 
      favicon-16x16.png: 
      favicon-32x32.png: 
      apple-touch-icon-180x180.png: 
